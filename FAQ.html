<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frequently Asked Questions – WEC-Pro</title>

  <!-- Tailwind CSS required for nav.js styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: { colors: { primary: { 600: "#003399", 700: "#003399" } } },
      },
    };
  </script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      color: #333;
      margin: 0;
      padding: 0;
    }

    /* Blur for sticky header */
    .header-blur { 
      background: rgba(255,255,255,0.9); 
      backdrop-filter: saturate(120%) blur(6px); 
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
      background-color: #fff;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      border-radius: 8px;
    }

    /* Scoped to .container to prevent Tailwind reset from reducing heading size/weight */
    .container h1 {
      font-size: 2em;
      font-weight: 700;
      color: #0f172a; /* slate-900 */
      margin-bottom: 30px;
      text-align: center;
      line-height: 1.25;
    }
    .container h2 {
      font-size: 1.3em;
      font-weight: 700;
      color: #0f172a;
      margin-top: 30px;
      margin-bottom: 10px;
      border-bottom: 1px solid #eee;
      padding-bottom: 5px;
      line-height: 1.35;
    }
    .container p {
      font-size: 1.1em;
      line-height: 1.6;
      margin-bottom: 20px;
      color: #333;
    }
    .container ul {
      font-size: 1.1em;
      line-height: 1.6;
      margin-bottom: 20px;
      padding-left: 20px;
      list-style-type: disc;
    }
    .container li {
      display: list-item;
      margin-bottom: 10px;
    }
    .container strong {
      font-weight: 700;
      color: #0f172a;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <div id="root"></div>

  <!-- React & Babel requirements for nav.js -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- External Nav Component -->
  <script src="nav.js"></script>

  <script type="text/babel">
    function App() {
      return (
        <div className="min-h-screen flex flex-col">
          {/* New Nav Component */}
          <SiteHeader />

          {/* Main Content */}
          <main className="flex-1">
            <div className="container">
              <h1>Frequently Asked Questions</h1>
              
              <section id="wec-pro-faq">
                
                <h2>1) What is WEC-Pro?</h2>
                <p>
                  WEC-Pro is a research project dedicated to advancing the commercial viability of <strong>Wave Energy Converters (WECs)</strong>. The project addresses the current barriers in the sector by integrating numerical modeling with <strong>Large-Scale Additive Manufacturing (LSAM)</strong>. By leveraging the expertise of partners like Politecnico di Torino and Caracol, WEC-Pro aims to streamline the design, production, and testing phases of marine energy devices, bridging the gap between theoretical optimization and industrial application.
                </p>

                <h2>2) Why is wave energy important?</h2>
                <p>
                  Ocean waves represent a massive, untapped global resource estimated at approximately <strong>32 PWh/year</strong>. Unlike other renewable sources, waves offer high energy density and greater predictability. Harnessing this resource can significantly expand the European renewable energy portfolio, reduce land usage requirements, and strengthen energy security by complementing the intermittency of wind and solar power.
                </p>

                <h2>3) What are today’s main challenges in the sector?</h2>
                <p>
                  The wave energy sector currently faces a "high-cost, low-readiness" cycle. Traditional manufacturing processes are complex and expensive, and design methods borrowed from naval engineering are often not tailored to the specific needs of energy absorption. These factors contribute to high development costs and low Technology Readiness Levels (TRLs), hindering the commercial scalability of devices.
                </p>

                <h2>4) How does LSAM (Large-Scale Additive Manufacturing) help?</h2>
                <p>
                  LSAM transforms the production landscape by enabling the rapid manufacturing of complex, hydrodynamically optimized geometries that are difficult to achieve with standard molds. This technology reduces material waste and allows for the use of sustainable materials. Crucially, when coupled with adapted optimization tools, LSAM has the potential to reduce the cost of devices by over <strong>10 times</strong> compared to traditional methods.
                </p>

                <h2>5) What are WEC-Pro’s specific goals?</h2>
                <p>
                  The project's primary goal is to upgrade established design methods by integrating LSAM manufacturing constraints directly into the modeling tools. WEC-Pro focuses on three main work packages: multi-parameter performance design, structural optimization, and physical testing. The project aims to validate these methods by producing and testing a fully 3D-printed physical model of a point absorber WEC for offshore application.
                </p>

                <h2>6) Who is involved in the project?</h2>
                <p>
                  WEC-Pro is a collaborative effort leveraging distinct areas of expertise. It is hosted at <strong>Politecnico di Torino (POLITO)</strong>, which provides strong expertise in WEC optimization. <strong>Caracol</strong>, Europe’s principal LSAM production center, leads the manufacturing innovations. Additionally, the project involves testing at specialized national laboratory to validate the physical model in fully operational environment.
                </p>

                <h2>7) What impact is expected?</h2>
                <p>
                  The project aims to deliver open-source tools and models for WEC power absorption and structural optimization, alongside valuable data sets for benchmarking LSAM-produced devices. Societally, it will raise awareness of ocean energy through outreach. Economically, it establishes a pipeline for collaborative R&D and supports the EU's renewable energy production targets.
                </p>

                <h2>8) How does WEC-Pro align with EU priorities?</h2>
                <p>
                  WEC-Pro directly supports the European Green Deal and REPowerEU initiatives by unlocking a new blue economy sector. It advances key Sustainable Development Goals (SDGs), specifically <strong>SDG 7</strong> (Affordable and Clean Energy), <strong>SDG 9</strong> (Industry, Innovation and Infrastructure), and <strong>SDG 13</strong> (Climate Action), by fostering a sustainable and fast manufacturing route for renewable energy technology.
                </p>

              </section>

              <figure style={{ textAlign: 'center', margin: '40px 0' }}>
                <img 
                  src="WEC-pro-team.jpg" 
                  alt="Chart showing global electricity generation mix 2023" 
                  style={{ maxWidth: '100%', height: 'auto', borderRadius: '8px', boxShadow: '0 4px 12px rgba(0,0,0,0.1)' }} 
                />
                <figcaption style={{ fontSize: '0.9em', color: '#64748b', marginTop: '10px', fontStyle: 'italic' }}>
                </figcaption>
              </figure>

            </div>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
