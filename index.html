    <script>
      const canvas = document.getElementById("waveCanvas");
      const ctx = canvas.getContext("2d");

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resizeCanvas();
      window.addEventListener("resize", resizeCanvas);

      const waves = [];
      for (let i = 0; i < 5; i++) {
        waves.push({
          amplitude: 10 + Math.random() * 20,
          frequency: 0.01 + Math.random() * 0.01,
          phase: Math.random() * 2 * Math.PI,
          speed: 0.02 + Math.random() * 0.02,
          color: `rgba(10, 60, 100, ${0.1 + i * 0.1})`,
        });
      }
      
      let speedFactor = 0.2;
      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        waves.forEach((wave) => {
          wave.phase += wave.speed * speedFactor;
          ctx.beginPath();
          for (let x = 0; x < canvas.width; x++) {
            const y = canvas.height / 2.1 + Math.sin(x * wave.frequency + wave.phase) * wave.amplitude;
            ctx.lineTo(x, y);
          }
          ctx.strokeStyle = wave.color;
          ctx.stroke();
        });
        requestAnimationFrame(draw);
      }
      draw();
      
      let lastMoveTime = Date.now();
      document.addEventListener("mousemove", () => {
        speedFactor = 1.0;
        lastMoveTime = Date.now();
      });
      setInterval(() => {
        if (Date.now() - lastMoveTime > 1000) speedFactor = 0.2;
      }, 120);
    </script>
