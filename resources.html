      padding: 0;
    }
    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
      background-color: #fff;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      border-radius: 8px;
    }
    h1 {
      font-size: 2em;
      color: #0f172a; /* slate-900 */
      margin-bottom: 20px;
      text-align: center;
    }
    p {
      font-size: 1.1em;
      line-height: 1.6;
      margin-bottom: 20px;
    }
    /* Preserves standard list bullets and link formatting under Tailwind */
    .container ul {
      list-style-type: disc;
      padding-left: 2.25rem;
      margin-bottom: 1rem;
    }
    .container li {
      margin-bottom: 0.5rem;
    }
    .container a {
      color: #003399;
      text-decoration: underline;
    }
    .container a:hover {
      color: #001f5c;
    }
    /* Sticky header blur matching index.html */
    .header-blur { 
      background: rgba(255, 255, 255, 0.9); 
      backdrop-filter: saturate(120%) blur(6px); 
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">
