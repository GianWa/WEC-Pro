<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work Packages – WEC-Pro</title>

  <!-- Tailwind CSS required for nav.js styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: { colors: { primary: { 600: "#003399", 700: "#003399" } } },
      },
    };
  </script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      color: #333;
      margin: 0;
      padding: 0;
    }
    /* Header/Nav styles removed to let nav.js and Tailwind handle the menu */
    
    .content-container {
      max-width: 900px;
      margin: 40px auto;
      padding: 30px;
      background-color: #fff;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      border-radius: 8px;
    }
    h1.page-title {
      font-size: 2em;
      color: #0f172a; /* slate-900 */
      margin-bottom: 20px;
      text-align: center;
    }
    h2.wp-title {
      font-size: 1.5em;
      color: #003399;
      margin-top: 10px;
      margin-bottom: 15px;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 8px;
    }
    p.page-text {
      font-size: 1.1em;
      line-height: 1.6;
      margin-bottom: 18px;
    }
    .wp-section {
      margin-top: 40px;
      padding-top: 10px;
    }
    .highlight-box {
      background-color: #f8fafc;
      border-left: 4px solid #003399;
      padding: 15px 20px;
      margin: 20px 0;
      border-radius: 0 6px 6px 0;
    }
    .highlight-box ul {
      margin: 8px 0 0 20px;
      list-style-type: disc;
    }
    .highlight-box li {
      margin-bottom: 6px;
      line-height: 1.5;
    }
    .figure-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin: 25px 0;
      align-items: start;
    }
    figure.report-figure {
      text-align: center;
      margin: 0;
      background: #fafafa;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
    }
    figure.report-figure img {
      max-width: 100%;
      height: auto;
      margin: 0 auto;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    figure.report-figure figcaption {
      font-size: 0.9em;
      color: #64748b;
      margin-top: 10px;
      font-style: italic;
      line-height: 1.4;
    }
    
    /* Slight blur under sticky header from your index.html */
    .header-blur { background: rgba(255,255,255,0.9); backdrop-filter: saturate(120%) blur(6px); }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  
  <div id="root"></div>

  <!-- React & Babel requirements for the nav component -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- External Nav Component -->
  <script src="nav.js"></script>

  <script type="text/babel">
    function App() {
      return (
        <div className="min-h-screen flex flex-col">
          {/* Nav Component */}
          <SiteHeader />

          {/* Main Content */}
          <main className="flex-1">
            <div className="content-container">
              <h1 className="page-title">Scientific Work Packages</h1>
              
              <p className="page-text">
                To make wave energy competitive and scalable, the WEC-Pro project rethinks how Wave Energy Converters (WECs) are designed, engineered, and built. By combining advanced computer simulations with Large-Format Additive Manufacturing (LFAM)—industrial-scale 3D printing—we can create complex, highly efficient floating devices at a fraction of traditional manufacturing costs.
              </p>

              <p className="page-text">
                The technical research of WEC-Pro is structured into three interconnected scientific Work Packages (WPs), taking WECs all the way from digital shape optimization to real-world wave testing:
              </p>

              {/* ================= WP1 ================= */}
              <section className="wp-section">
                <h2 className="wp-title">
                  WP1 - Wave energy converter design for power absorption: optimizing outer geometry
                </h2>
                
                <p className="page-text">
                  The first step in designing an efficient Wave Energy Converter is shaping its outer hull so that it captures as much energy from incoming sea waves as possible. Traditional manufacturing methods (like steel welding) restrict engineers to simple, boxy, or circular shapes. Because 3D printing removes these geometric barriers, WP1 upgrades existing numerical design tools to explore smooth, organic, "spline-based" hull profiles tuned to local wave climates.
                </p>

                <p className="page-text">
                  Crucially, our optimization algorithms incorporate 3D-printing rules right from the start—such as avoiding steep overhang angles (kept below 60°) that would collapse during printing. This ensures that every high-performing shape generated by the computer can actually be manufactured.
                </p>

                <div className="highlight-box">
                  <strong>Latest Key Achievements in WP1:</strong>
                  <ul>
                    <li>
                      <strong>Pendulum WEC (PeWEC) Optimization:</strong> Using a Genetic Algorithm inspired by biological evolution, thousands of hull profiles were simulated. Moving from conventional circular arcs to smooth spline curves reduced energy losses in the water and boosted Annual Energy Production (AEP) by up to 33%.
                    </li>
                    <li>
                      <strong>Point Absorber (PA) Development:</strong> A Monte Carlo simulation tool automatically generated 50,000 buoy shapes and filtered them through strict 3D-printing rules. The 1,130 valid geometries were then simulated in sea waves to find the single best profile that maximizes power output relative to the material used.
                    </li>
                  </ul>
                </div>

                <div className="figure-grid">
                  <figure className="report-figure">
                    <img 
                      src="wp1_pewec_comparison.png" 
                      alt="Comparison between arc-based and spline-based WEC hull profiles" 
                    />
                    <figcaption>
                      Transitioning from traditional arc-based hulls to smooth spline-based profiles unlocks higher energy capture and lower cost of energy.
                    </figcaption>
                  </figure>

                  <figure className="report-figure">
                    <img 
                      src="wp1_pa_splines.png" 
                      alt="Accepted 3D-printable spline profiles for the Point Absorber" 
                    />
                    <figcaption>
                      Out of 50,000 computer-generated buoy profiles, 1,130 printable shapes passed the 3D-printing filters for hydrodynamic evaluation.
                    </figcaption>
                  </figure>
                </div>
              </section>

              {/* ================= WP2 ================= */}
              <section className="wp-section">
                <h2 className="wp-title">
                  WP2 - Structural toolbox for LSAM incorporation: optimizing internal structure
                </h2>
                
                <p className="page-text">
                  A wave energy buoy cannot simply be an empty shell; it must withstand harsh wave impacts while remaining lightweight and economical to print. Building on the optimal outer shape found in WP1, WP2 focuses on engineering the internal structure and establishing an open-source LFAM Structural Toolbox using FreeCAD.
                </p>

                <p className="page-text">
                  Working closely with industrial 3D-printing experts at Caracol AM, the internal architecture of the selected Point Absorber buoy was designed around "Design for Additive Manufacturing" (DfAM) principles. Rather than using wasteful internal support structures during printing, the buoy is engineered to be printed upside down, with self-supporting internal circular walls that naturally build inward.
                </p>

                <div className="highlight-box">
                  <strong>Latest Key Achievements in WP2:</strong>
                  <ul>
                    <li>
                      <strong>Smart Internal Architecture:</strong> Integrated two internal ballast chambers that serve a dual purpose—holding water or weights to achieve the exact target floating draft, while acting as structural ribs that stiffen the outer hull against wave slamming.
                    </li>
                    <li>
                      <strong>Testing-Ready Features:</strong> Built in a central square guide slot (to keep the buoy moving purely up and down in waves) and waterproof top hatches for sensors and cables.
                    </li>
                    <li>
                      <strong>Marine-Grade Material & Stress Analysis:</strong> Verified the 10 mm hull using Finite Element Analysis (FEA) across five critical wave-load scenarios with PP GF30 (polypropylene reinforced with 30% glass fiber)—a tough, corrosion-free composite ideal for the ocean environment.
                    </li>
                  </ul>
                </div>

                <div className="figure-grid">
                  <figure className="report-figure">
                    <img 
                      src="wp2_internal_structure.png" 
                      alt="3D CAD model showing internal ballast chambers and central guide slot" 
                    />
                    <figcaption>
                      Internal CAD layout of the Point Absorber showing the central vertical guide slot, internal stiffening ballast chambers, and sensor access ports.
                    </figcaption>
                  </figure>

                  <figure className="report-figure">
                    <img 
                      src="wp2_fem_stress.png" 
                      alt="Finite Element Analysis stress distribution on the 3D-printed buoy" 
                    />
                    <figcaption>
                      Finite Element Analysis (FEA) verifying how the internal ribs and 10 mm glass-fiber reinforced shell safely distribute extreme wave loads.
                    </figcaption>
                  </figure>
                </div>
              </section>

              {/* ================= WP3 ================= */}
              <section className="wp-section">
                <h2 className="wp-title">
                  WP3 - Application and validation of LSAM for WECs: physical manufacturing & wave tank testing
                </h2>
                
                <p className="page-text">
                  While computer models are powerful, real ocean waves are complex and nonlinear. WP3 brings our digital designs into the physical world to validate the numerical tools developed in WP1 and WP2 and demonstrate the real-world reliability of 3D-printed wave energy converters.
                </p>

                <p className="page-text">
                  Following the optimized hydrodynamic and structural design from the previous work packages, a 1-meter diameter Point Absorber physical prototype (~200 kg displacement) has been manufactured via Large-Format Additive Manufacturing (LFAM) using glass-fiber reinforced polypropylene.
                </p>

                <p className="page-text">
                  The physical model is now being outfitted with a dedicated suite of sensors and a simplified Power Take-Off (PTO) actuator system. It will soon undergo wave testing to measure its real-time motion, structural behavior, and power absorption efficiency across a variety of real sea conditions.
                </p>

                <div className="highlight-box">
                  <strong>What WP3 Measures & Validates:</strong>
                  <ul>
                    <li>
                      <strong>Hydrodynamics & Motion:</strong> Tracking how effectively the optimized spline hull oscillates vertically in response to incoming waves.
                    </li>
                    <li>
                      <strong>Structural Behavior & Loads:</strong> Measuring horizontal and vertical wave forces acting on the 3D-printed shell and support frame to confirm structural resilience.
                    </li>
                    <li>
                      <strong>Overall Efficiency & Reliability:</strong> Comparing experimental power absorption and structural data against our WP1/WP2 computer predictions to provide open-access benchmarks for the marine energy community.
                    </li>
                  </ul>
                </div>

                <div className="figure-grid">
                  <figure className="report-figure">
                    <img 
                      src="wp3_test_setup.png" 
                      alt="Schematic of the 1m Point Absorber wave testing setup" 
                    />
                    <figcaption>
                      Experimental setup schematic for the 1-meter LFAM-printed Point Absorber equipped with wave probes, load sensors, and PTO actuator.
                    </figcaption>
                  </figure>

                  <figure className="report-figure">
                    <img 
                      src="wp3_printed_prototype.png" 
                      alt="Optimal Point Absorber profile and experimental configuration" 
                    />
                    <figcaption>
                      The optimized 1m Point Absorber geometry (0.75 m draft, 0.25 m freeboard) produced via LFAM and prepared for sensor-equipped wave testing.
                    </figcaption>
                  </figure>
                </div>
              </section>

            </div>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
